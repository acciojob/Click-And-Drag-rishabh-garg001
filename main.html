<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click and Drag</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .items {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, 100px);
      grid-template-rows: repeat(5, 100px);
      gap: 10px;
      width: 560px;
      height: 560px;
      padding: 10px;
      margin: 40px auto;
      border: 4px solid #333;
      box-sizing: border-box;
      background: #fff;
    }
    .item {
      position: relative;
      left: 0;
      top: 0;
      width: 100px;
      height: 100px;
      background: #ffc600;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      cursor: grab;
      user-select: none;
    }
    .item.active {
      cursor: grabbing;
      z-index: 10;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="items">
    <div class="item item1">01</div>
    <div class="item item2">02</div>
    <div class="item item3">03</div>
    <div class="item item4">04</div>
    <div class="item item5">05</div>
    <div class="item item6">06</div>
    <div class="item item7">07</div>
    <div class="item item8">08</div>
    <div class="item item9">09</div>
    <div class="item item10">10</div>
    <div class="item item11">11</div>
    <div class="item item12">12</div>
    <div class="item item13">13</div>
    <div class="item item14">14</div>
    <div class="item item15">15</div>
    <div class="item item16">16</div>
    <div class="item item17">17</div>
    <div class="item item18">18</div>
    <div class="item item19">19</div>
    <div class="item item20">20</div>
    <div class="item item21">21</div>
    <div class="item item22">22</div>
    <div class="item item23">23</div>
    <div class="item item24">24</div>
    <div class="item item25">25</div>
  </div>

<script>
  const container = document.querySelector(".items");
  const items = document.querySelectorAll(".item");

  let active = null;     // drag hone wala cube
  let startX = 0;        // mousedown par mouse position
  let startY = 0;
  let origX = 0;         // mousedown par cube ka left/top
  let origY = 0;
  let baseLeft = 0;      // cube ki asli grid position
  let baseTop = 0;
  let moved = false;     // mouse hila ya nahi

  items.forEach(item => {
    item.dataset.x = 0;
    item.dataset.y = 0;

    // Click: drag mode on
    item.addEventListener("mousedown", (e) => {
      e.preventDefault();
      active = item;
      moved = false;
      startX = e.clientX;
      startY = e.clientY;
      origX = parseFloat(item.dataset.x);
      origY = parseFloat(item.dataset.y);
      baseLeft = item.offsetLeft - origX;
      baseTop = item.offsetTop - origY;
      item.classList.add("active");
    });
  });

  // Drag: cube mouse ke saath chale
  document.addEventListener("mousemove", (e) => {
    if (!active) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    // Thoda sa hilna drag nahi maana jayega
    if (!moved && Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
    moved = true;

    let x = origX + dx;
    let y = origY + dy;

    // Boundary: container ke bahar na jaaye
    const minX = -baseLeft;
    const minY = -baseTop;
    const maxX = container.clientWidth - active.offsetWidth - baseLeft;
    const maxY = container.clientHeight - active.offsetHeight - baseTop;
    x = Math.min(Math.max(x, minX), maxX);
    y = Math.min(Math.max(y, minY), maxY);

    active.style.left = x + "px";
    active.style.top = y + "px";
    active.dataset.x = x;
    active.dataset.y = y;
  });

  // Drop: cube nayi jagah par ruk jaaye
  document.addEventListener("mouseup", () => {
    if (!active) return;

    if (!moved) {
      // Sirf click hua, drag nahi: cube apni jagah hi rahe
      active.style.left = origX + "px";
      active.style.top = origY + "px";
      active.dataset.x = origX;
      active.dataset.y = origY;
    }

    active.classList.remove("active");
    active = null;
  });
</script>

  </body>
</html>
