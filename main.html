<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click and Drag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="items">
    <div class="item item1">01</div>
    <div class="item item2">02</div>
    <div class="item item3">03</div>
    <div class="item item4">04</div>
    <div class="item item5">05</div>
    <div class="item item6">06</div>
    <div class="item item7">07</div>
    <div class="item item8">08</div>
    <div class="item item9">09</div>
    <div class="item item10">10</div>
    <div class="item item11">11</div>
    <div class="item item12">12</div>
    <div class="item item13">13</div>
    <div class="item item14">14</div>
    <div class="item item15">15</div>
    <div class="item item16">16</div>
    <div class="item item17">17</div>
    <div class="item item18">18</div>
    <div class="item item19">19</div>
    <div class="item item20">20</div>
    <div class="item item21">21</div>
    <div class="item item22">22</div>
    <div class="item item23">23</div>
    <div class="item item24">24</div>
    <div class="item item25">25</div>
  </div>

<script>
//Your code goes here 
	// Your code here.
const container = document.querySelector(".items");
  const items = document.querySelectorAll(".item");

  // 1. Grid wali positions pehle save karo
  const positions = [...items].map(item => ({
    left: item.offsetLeft,
    top: item.offsetTop,
    width: item.offsetWidth,
    height: item.offsetHeight
  }));

  // 2. Har cube ko usi jagah absolute position do
  items.forEach((item, i) => {
    item.style.position = "absolute";
    item.style.left = positions[i].left + "px";
    item.style.top = positions[i].top + "px";
    item.style.width = positions[i].width + "px";
    item.style.height = positions[i].height + "px";
  });

  let active = null;   // jo cube drag ho raha hai
  let shiftX = 0;      // mouse aur cube ke corner ka gap
  let shiftY = 0;
  let zIndex = 1;

  // 3. mousedown: cube select karo
  items.forEach(item => {
    item.addEventListener("mousedown", (e) => {
      e.preventDefault(); // text select na ho
      active = item;
      const rect = item.getBoundingClientRect();
      shiftX = e.clientX - rect.left;
      shiftY = e.clientY - rect.top;
      item.classList.add("active");
      item.style.zIndex = ++zIndex; // drag hone wala cube sabse upar
    });
  });

  // 4. mousemove: cube ko mouse ke saath le jao
  document.addEventListener("mousemove", (e) => {
    if (!active) return;

    const box = container.getBoundingClientRect();
    let x = e.clientX - box.left - container.clientLeft - shiftX;
    let y = e.clientY - box.top - container.clientTop - shiftY;

    // Boundary: container ke bahar na jaaye
    const maxX = container.clientWidth - active.offsetWidth;
    const maxY = container.clientHeight - active.offsetHeight;
    x = Math.min(Math.max(x, 0), maxX);
    y = Math.min(Math.max(y, 0), maxY);

    active.style.left = x + "px";
    active.style.top = y + "px";
  });

  // 5. mouseup: cube wahin chhod do
  document.addEventListener("mouseup", () => {
    if (!active) return;
    active.classList.remove("active");
    active = null;
  });
</script>

  </body>
</html>
